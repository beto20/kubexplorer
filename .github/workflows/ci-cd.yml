# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI-CD

on:
  push:
    branches:
      - master

env:
  APP_NAME: Tider

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release-tag:
    name: Create release tag
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false
          pre_release_branches: master
          append_to_pre_release_tag: alpha

      - name: Show generated version
        if: steps.tag.outputs.new_tag != ''
        run: |
          echo "Generated tag: ${{ steps.tag.outputs.new_tag }}"

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          prerelease: ${{ contains(steps.tag.outputs.new_tag, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    needs: release-tag

    if: >-
      needs.release-tag.outputs.new_tag != '' &&
      needs.release-tag.outputs.new_tag != 'undefined'

    runs-on: macos-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.release-tag.outputs.new_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.new_tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: "1.25.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"

      - name: Verify release version
        shell: bash
        run: |
          echo "Application: $APP_NAME"
          echo "Version: $VERSION"
          echo "Checked-out ref: $(git describe --tags --exact-match)"

      - name: Build and compress
        shell: bash
        run: |
          set -euo pipefail

          go install github.com/wailsapp/wails/v2/cmd/wails@latest

          wails build \
            -ldflags "-X app/backend/common.Version=$VERSION" \
            -platform darwin/universal \
            -o "$APP_NAME"

          chmod +x "build/bin/$APP_NAME.app/Contents/MacOS/"*

          mkdir -p _build _dist
          cp -R "build/bin/$APP_NAME.app" "_build/"

          brew install create-dmg

          create-dmg \
            --no-internet-enable \
            --volname "$APP_NAME" \
            --volicon "_build/$APP_NAME.app/Contents/Resources/iconfile.icns" \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon "$APP_NAME.app" 180 180 \
            --icon-size 100 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 480 180 \
            "_dist/$APP_NAME-$VERSION-macos.dmg" \
            "_build/"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.new_tag }}
          files: _dist/*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
