# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI-CD

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release-tag:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false
          pre_release_branches: master
          append_to_pre_release_tag: alpha

      - name: Create release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          prerelease: ${{ contains(steps.tag.outputs.new_tag, '-alpha') }}

  deploy:
    needs: release-tag
    if: needs.release-tag.outputs.new_tag != ''
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: Tider
            suffix: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: Tider.exe
            suffix: windows-amd64.exe
          - os: macos-latest
            platform: darwin/universal
            artifact: Tider.app.zip
            suffix: darwin-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Wails app
        uses: dAppServer/wails-build-action@d0b7d7500f3344ebed78d1a59e3f183977d62d1f
        with:
          go-version: '1.24'
          node-version: '26.4.0'
          wails-version: 'v2.10.1'
          build-name: Tider
          build-platform: ${{ matrix.platform }}
          package: false

      - name: Stage release asset
        shell: bash
        env:
          TAG: ${{ needs.release-tag.outputs.new_tag }}
        run: |
          mkdir -p dist
          cp "build/bin/${{ matrix.artifact }}" "dist/Tider-${TAG}-${{ matrix.suffix }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.new_tag }}
          files: dist/Tider-*
          fail_on_unmatched_files: true
