# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI-CD

on:
  push:
    branches:
      - master

env:
  APP_NAME: Tider
  NODE_VERSION: "26.4.0"
  WAILS_VERSION: "v2.13.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/quality.yml

  release-tag:
    name: Create release tag
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false
          pre_release_branches: master
          append_to_pre_release_tag: alpha

      - name: Show generated version
        if: steps.tag.outputs.new_tag != ''
        shell: bash
        run: |
          echo "Generated tag: ${{ steps.tag.outputs.new_tag }}"

  build-macos:
    name: Build macOS
    needs: release-tag

    if: >-
      needs.release-tag.outputs.new_tag != '' &&
      needs.release-tag.outputs.new_tag != 'undefined'

    runs-on: macos-15
    timeout-minutes: 10

    env:
      VERSION: ${{ needs.release-tag.outputs.new_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-tag.outputs.new_tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
  
          echo "Application: $APP_NAME"
          echo "Version: $VERSION"
          echo "Checked-out ref: $(git describe --tags --exact-match)"

      - name: Install Wails
        shell: bash
        run: |
          set -euo pipefail
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"

      - name: Build macOS universal application
        shell: bash
        run: |
          set -euo pipefail

          wails build -clean -ldflags "-X app/backend/common.Version=$VERSION" \
            -platform darwin/universal \
            -o "$APP_NAME"

      - name: Verify universal binary
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/bin/$APP_NAME.app"
          BINARY_PATH="$APP_PATH/Contents/MacOS/$APP_NAME"
          
          test -d "$APP_PATH"
          test -f "$BINARY_PATH"

          chmod +x "$BINARY_PATH"
          echo "Application binary information:"
          file "$BINARY_PATH"
          
          echo "Application binary architectures:"
          ARCHITECTURES="$(lipo -archs "$BINARY_PATH")"
          echo "$ARCHITECTURES"

          lipo "$BINARY_PATH" -verify_arch x86_64 arm64
          echo "Universal binary verification succeeded."

      - name: Apply ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail
  
          APP_PATH="build/bin/$APP_NAME.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=2 "$APP_PATH"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
  
          APP_PATH="build/bin/$APP_NAME.app"
          DMG_PATH="_dist/$APP_NAME-$VERSION-macos-universal.dmg"
          mkdir -p _build _dist
          cp -R "$APP_PATH" "_build/"

          brew install create-dmg

          create-dmg \
            --no-internet-enable \
            --volname "$APP_NAME" \
            --volicon "_build/$APP_NAME.app/Contents/Resources/iconfile.icns" \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon "$APP_NAME.app" 180 180 \
            --icon-size 100 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 480 180 \
            "$DMG_PATH" \
            "_build/"

          test -f "$DMG_PATH"
  
          echo "Created DMG:"
          ls -lh "$DMG_PATH"
  
          shasum -a 256 "$DMG_PATH"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: _dist/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-linux:
    name: Build Linux
    needs: release-tag

    if: >-
      needs.release-tag.outputs.new_tag != '' &&
      needs.release-tag.outputs.new_tag != 'undefined'

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      VERSION: ${{ needs.release-tag.outputs.new_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-tag.outputs.new_tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Wails
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          echo "Application: $APP_NAME"
          echo "Version: $VERSION"
          echo "Checked-out ref: $(git describe --tags --exact-match)"

      - name: Build Linux application
        shell: bash
        run: |
          set -euo pipefail
          wails build -clean -tags webkit2_41 -ldflags "-X app/backend/common.Version=$VERSION" \
            -platform linux/amd64 \
            -o "$APP_NAME"

      - name: Package Linux application
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$APP_NAME-$VERSION-linux-amd64"
          PACKAGE_ROOT="_package"
          PACKAGE_DIR="$PACKAGE_ROOT/$PACKAGE_NAME"
          ARCHIVE="_dist/$PACKAGE_NAME.tar.gz"

          mkdir -p "$PACKAGE_DIR" _dist
          install -m 0755 "build/bin/$APP_NAME" "$PACKAGE_DIR/$APP_NAME"

          for candidate in README.md readme.md LICENSE; do
            if [[ -f "$candidate" ]]; then
              cp "$candidate" "$PACKAGE_DIR/"
            fi
          done

          tar -C "$PACKAGE_ROOT" -czf "$ARCHIVE" "$PACKAGE_NAME"
          tar -tzf "$ARCHIVE"

      - name: Upload Linux workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: _dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-windows:
    name: Build Windows
    needs: release-tag

    if: >-
      needs.release-tag.outputs.new_tag != '' &&
      needs.release-tag.outputs.new_tag != 'undefined'

    runs-on: windows-2025
    timeout-minutes: 10

    env:
      VERSION: ${{ needs.release-tag.outputs.new_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-tag.outputs.new_tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION"

      - name: Verify release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Application: $env:APP_NAME"
          Write-Host "Version: $env:VERSION"

          $checkedOutTag = git describe --tags --exact-match
          Write-Host "Checked-out ref: $checkedOutTag"

      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          wails build -clean -ldflags "-X app/backend/common.Version=$env:VERSION" `
            -platform windows/amd64 `
            -o "$env:APP_NAME.exe"

      - name: Package Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $packageName = "$env:APP_NAME-$env:VERSION-windows-amd64"
          $packageDir = Join-Path "_package" $packageName
          $archivePath = Join-Path "_dist" "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $packageDir, "_dist" | Out-Null
          Copy-Item "build/bin/$env:APP_NAME.exe" -Destination $packageDir

          foreach ($candidate in @("README.md", "readme.md", "LICENSE")) {
            if (Test-Path $candidate) {
              Copy-Item $candidate -Destination $packageDir
            }
          }

          Compress-Archive -Path $packageDir -DestinationPath $archivePath -CompressionLevel Optimal
          Get-Item $archivePath

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: _dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    name: Publish GitHub release

    needs:
      - release-tag
      - build-macos
      - build-linux
      - build-windows

    if: >-
      needs.release-tag.outputs.new_tag != '' &&
      needs.release-tag.outputs.new_tag != 'undefined'

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.release-tag.outputs.new_tag }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Assets for release $VERSION:"
          find release-assets -maxdepth 1 -type f -print

          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.new_tag }}
          name: ${{ needs.release-tag.outputs.new_tag }}
          body: ${{ needs.release-tag.outputs.changelog }}
          prerelease: ${{ contains(needs.release-tag.outputs.new_tag, '-alpha') }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}